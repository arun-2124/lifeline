name: mobile_app
description: "Lifeline Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase Core & Products
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  firebase_app_check: ^0.4.1+3

  # State Management
  flutter_riverpod: ^2.5.1

  # UI & Styling
  google_fonts: ^6.2.1

  # Maps, QR & Geo Utilities
  qr_flutter: ^4.1.0
  geolocator: ^13.0.2

  # Utilities
  equatable: ^2.0.5
  http: ^1.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
